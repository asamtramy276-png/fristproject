
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى سجود ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ff0055, #7600ec, #ff416c, #8a2be2);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* القلوب الطائرة في الخلفية */
        .bg-heart {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* كارت الاعتراف */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 2.5rem;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .card h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .card p {
            font-size: 1rem;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input[type="text"]:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            background: #fff;
            color: #ff0055;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        /* منطقة النتيجة */
        .result-box {
            margin-top: 25px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-text {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px #ff0055;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* قلوب الانفجار عند الضغط */
        .burst-heart {
            position: absolute;
            pointer-events: none;
            font-size: 1.8rem;
            animation: burst 1s forwards ease-out;
            z-index: 100;
        }

        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.8) rotate(360deg);
                opacity: 0;
            }
        }
    </style>

</head>
<body>

    <!-- القلوب الطائرة في خلفية الصفحة -->
    <div id="bgHearts"></div>

    <div class="card">
        <h1>اكتبي اسمك أو اسمي وشوفي السر... ❤️</h1>
        <p>مستني إجابتك بفارغ الصبر ✨</p>
        
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="اكتبي الإسم هنا..." autocomplete="off">
        </div>
        
        <button onclick="checkName()">دوسيها وبصي للمفاجأة 💖</button>

        <div class="result-box">
            <div id="resultText" class="result-text"></div>
        </div>
    </div>

    <script>
        // الأسماء مضبوطة
        const MY_NAME = "أسامة";     // اسمك
        const HER_NAME = "سجود";    // اسمها

        // القلوب المتحركة في الخلفية تلقائياً
        const bgHeartsContainer = document.getElementById('bgHearts');
        const heartIcons = ['❤️', '💖', '💕', '💗', '💓', '✨'];

        for (let i = 0; i < 25; i++) {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            bgHeartsContainer.appendChild(heart);
        }

        // دالة الفحص عند ضغط الزر
        function checkName() {
            const rawVal = document.getElementById('nameInput').value.trim();
            const resultDiv = document.getElementById('resultText');
            
            if (!rawVal) {
                resultDiv.style.display = 'block';
                resultDiv.innerText = "اكتبي اسم الأول يا سجود! 😉";
                return;
            }

            // تنظيف النص لضمان التعرف على الأسماء بأي طريقة كتابة (بالألف الممدودة أو العادية)
            const inputVal = rawVal.toLowerCase().replace(/[أإآ]/g, 'ا');
            const cleanMyName = MY_NAME.toLowerCase().replace(/[أإآ]/g, 'ا');
            const cleanHerName = HER_NAME.toLowerCase().replace(/[أإآ]/g, 'ا');

            // لو كتبت اسمك أنت (أسامة / اسامة)
            if (inputVal.includes(cleanMyName)) {
                resultDiv.innerText = "I LOVE YOU! 💖✨";
                triggerHeartBurst();
            } 
            // لو كتبت اسمها هي (سجود)
            else if (inputVal.includes(cleanHerName)) {
                resultDiv.innerText = "I LOVE YOU TOO! 💕🔥";
                triggerHeartBurst();
            } 
            // لو كتبت أي حاجة تانية
            else {
                resultDiv.innerText = "بحبك يا سجود مهما كتبتي! ❤️";
                triggerHeartBurst();
            }

            // إعادة تشغيل أنيميشن النص
            resultDiv.style.display = 'block';
            resultDiv.style.animation = 'none';
            resultDiv.offsetHeight; // Reflow
            resultDiv.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        }

        // إفكت انفجار القلوب لما تضغط الزرار
        function triggerHeartBurst() {
            const symbols = ['❤️', '💖', '💕', '✨', '💗', '🥰', '😍'];
            const count = 30;

            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.classList.add('burst-heart');
                heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];

                heart.style.left = '50%';
                heart.style.top = '50%';

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 250 + 100;
                const dx = Math.cos(angle) * distance + 'px';
                const dy = Math.sin(angle) * distance + 'px';

                heart.style.setProperty('--dx', dx);
                heart.style.setProperty('--dy', dy);

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 1000);
            }
        }
    </script>
    
</body>
</html>
