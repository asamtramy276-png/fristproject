<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="programming.css"> 
    <script src="Script.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"> 
    <title>Learn Programming</title>
</head>
<body>

  <h1>مجالات البرمجة</h1>

  <div class="grid" id="grid">
    <div class="card" data-title="برمجة الويب" data-desc="تعلم بناء المواقع باستخدام HTML وCSS وJavaScript وأطر العمل الحديثة.">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>
      <span>برمجة الويب</span>
    </div>

    <div class="card" data-title="أساسيات البرمجة" data-desc="المفاهيم الأساسية للبرمجة: المتغيرات، الشروط، الحلقات، والدوال.">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span>أساسيات البرمجة</span>
    </div>

    <div class="card" data-title="علوم البيانات" data-desc="تحليل البيانات واستخلاص النتائج باستخدام Python وأدوات التصور.">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>علوم البيانات</span>
    </div>

    <div class="card" data-title="تطوير التطبيقات" data-desc="بناء تطبيقات الموبايل لأنظمة أندرويد و iOS.">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <span>تطوير التطبيقات</span>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span id="panel-title-text"></span>
    </div>
    <div class="panel-text" id="panel-desc-text"></div>
  </div>

</body>
</html>
