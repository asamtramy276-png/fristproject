  
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق المهام</title>
</head>
<body>

  <div class="container">
    <h2>قائمة المهام📝</h2>
    
    <!-- حقل الإدخال وزر الإضافة -->
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="اكتب المهمة هنا...">
      <button id="addBtn">إضافة</button>
    </div>

    <!-- القائمة التي ستضاف فيها المهام -->
    <div class="list"></div>
  </div>


 <style>
    
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background-color: #121212;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}


.container {
  background-color: #1e1e1e;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  width: 100%;
  max-width: 450px;
}

h2 {
  text-align: center;
  color: #00d2d3;
  margin-bottom: 20px;
}


.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  padding: 12px 15px;
  border-radius: 8px;
  border: 1px solid #333;
  background-color: #2a2a2a;
  color: #fff;
  font-size: 16px;
  outline: none;
}

input::placeholder {
  color: #888;
}

button {
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  background-color: #00d2d3;
  color: #121212;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover {
  background-color: #00b5b6;
}


.list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.list ul {
  list-style: none;
  background-color: #2a2a2a;
  padding: 12px 16px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.2s ease;
}

.list ul:hover {
  background-color: #333;
}


.list ul li:first-child {
  cursor: pointer;
  color: #ffffff;
  font-size: 16px;
  word-break: break-all;
}


.done {
  text-decoration: line-through;
  color: #888 !important;
}


.list ul li:last-child {
  color: #ff5252 !important;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  padding: 4px 8px;
  border-radius: 4px;
  transition: 0.2s;
}

.list ul li:last-child:hover {
  background-color: rgba(255, 82, 82, 0.1);
}

 </style>


<script>

 
// استدعاء العناصر بالـ ID والـ Class المحدد
const input = document.getElementById("taskInput");
const btn = document.getElementById("addBtn");
const list = document.querySelector(".list");

btn.addEventListener("click", function () {
  if (input.value.trim() === "") {
    alert("ادخل المهمة");
  } else {
    let ul = document.createElement("ul");
    let li1 = document.createElement("li");
    let li2 = document.createElement("li");

    li1.textContent = input.value;
    li2.textContent = "حذف";
    li2.style.color = "red";
    li2.style.cursor = "pointer";

    ul.appendChild(li1);
    ul.appendChild(li2);
    list.appendChild(ul);

    input.value = "";

    li1.addEventListener("click", function () {
      li1.classList.toggle("done");
    });

    li2.addEventListener("click", function () {
      ul.remove();
    });
  }
});

</script>


</body>
</html>
