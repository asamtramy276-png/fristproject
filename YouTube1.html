<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>YouTube</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="StyleYouTube1.CSS">
</head>
<body>

  <header class="yt-header">
    
    <div class="header-section center-section">
      
      
      <div class="search-box">
        
        <button class="keyboard-btn" title="لوحة المفاتيح">
          <i class="fa-regular fa-keyboard"></i>
        </button>
        
        <input type="text" placeholder="بحث">

        <button class="search-btn" title="بحث">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button class="icon-btn voice-btn" title="البحث بالصوت">
        <i class="fa-solid fa-microphone"></i>
        
      </button>
      
      </div>
    

    <div class="header-section left-section">
      
      <button class="A-create">
        <i class="fa-solid fa-plus"></i>
        <span>إنشاء</span>
      </button>
      
<button class="icon-btn" title="الإشعارات">
        <i class="fa-regular fa-bell"></i>
      </button>

      <button class="avatar-btn" title="الحساب">
        <span class="avatar-letter">O</span>
      </button>
    </div>

  </header>

  <nav class="categories-bar">
    <button class="chip active">محتوى جديد لك</button>
    <button class="chip">فيديوهات محملة مؤخرًا</button>
    <button class="chip">ألعاب فيديو رياضية</button>
    <button class="chip">كرة القدم</button>
    <button class="chip">ألعاب مغامرات وحركة</button>
    <button class="chip">رسوم متحركة</button>
    <button class="chip">مباشر</button>
    <button class="chip">ميكسات</button>
    <button class="chip">بودكاست</button>
    <button class="chip">موسيقى</button>
  </nav>

  <main class="video-grid">
    
    <div class="video-card">
      <div class="thumbnail-container">
        <img src="https://via.placeholder.com/360x202/111/fff?text=Quran" alt="صورة الفيديو">
        <span class="duration">1:40:14</span>
      </div>
      <div class="video-info">
        <div class="channel-avatar">
          <img src="https://via.placeholder.com/36/333/fff?text=Q" alt="القناة">
        </div>
        <div class="video-details">
          <h3 class="video-title">قرآن الصباح... أجمل ما تبدأ به يومك لصاحب الحجرة الذهبية الشيخ محمد صديق المنشاوي</h3>
          <p class="channel-name">Naqaa Quran - نقاء</p>
          <p class="video-stats">715 ألف مشاهدة • قبل 6 أشهر</p>
        </div>
        <button class="options-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </div>

    <div class="video-card">
      <div class="thumbnail-container">
        <img src="https://via.placeholder.com/360x202/222/fff?text=Anime" alt="صورة الفيديو">
        <span class="duration">1:04:08</span>
      </div>
      <div class="video-info">
        <div class="channel-avatar">
          <img src="https://via.placeholder.com/36/444/fff?text=S" alt="القناة">
        </div>
        <div class="video-details">
          <h3 class="video-title">أقوي مقاتل في العالم بيرجع من تاني بعد ما غدروا بيه ليثبت أنه الأعظم في تاريخ البشريه 😎 || ملخص كامل</h3>
          <p class="channel-name">شادو - SHADOW <i class="fa-solid fa-circle-check check-icon"></i></p>
          <p class="video-stats">2.1 مليون مشاهدة • قبل شهرين</p>
        </div>
        <button class="options-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </div>

  </main>


        </body>
    </html>
