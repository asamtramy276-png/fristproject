<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body>

    <div id="calculator_container">
          <div class="calculator_row">
            <div id="dispaly_area"></div>
            <button>C</button>
            <button>(</button>
            <button>)</button>
            <button>/</button>
          </div>
          <div class="calculator_row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
          </div>
          <div class="calculator_row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
          </div>
          <div class="calculator_row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
          </div>
          <div class="calculator_row">
            <button>DEL</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
          </div>
 <Style>
  #calculator_container{
    display:flex;
    flex-direction: column;
    background-color: royalblue;
    width:fit-content ;
    padding:20px;
    align-items:center;
    border-radius:10px;
    margin: 10px auto;
}


#dispaly_area {
    background-color: rgb(218, 221, 223);
    height: 70px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 15px;
    border-radius: 5px;
    padding: 10px;
    font-size: 28px;
    font-weight: bold;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: flex-end; 
    word-break: break-all;
}

.calculator_row{
    margin: 5px auto;
    
}

.calculator_row button{
    width:60px;
    height:60px;
    font-size:20px;
    border:none;
    border-radius:10px;
    margin:5px;
    background-color:rgb(110, 183, 110);
    color:#fff;
}

.calculator_row button:hover{
    background-color:rgb(84, 138, 84);
    cursor:pointer;
}
 </Style>

 <script>
  const displayArea = document.getElementById('dispaly_area');
const buttons = document.querySelectorAll('.calculator_row button');

buttons.forEach(button => {
    button.addEventListener('click', e => {
        const buttonText = e.target.innerText;

        if (buttonText === 'C') {
            displayArea.innerText = '';
        } 
    
        else if (buttonText === 'DEL') {
            displayArea.innerText = displayArea.innerText.slice(0, -1);
        } 

        else if (buttonText === '=') {
            if (displayArea.innerText.trim() !== '') {
                try {
                    displayArea.innerText = eval(displayArea.innerText);
                } catch (error) {
                    displayArea.innerText = 'Error';
                }
            }
        } 
        
        else {
           
            if (displayArea.innerText === 'Error') {
                displayArea.innerText = '';
            }
            displayArea.innerText += buttonText;
        }
    });
});

 </script>


    </div>
    
</body>
</html>
