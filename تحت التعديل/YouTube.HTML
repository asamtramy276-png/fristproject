<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/a/ac/Logo_youtube_ios_%28cropped%29.jpg?utm_source=ar.wikipedia.org&utm_campaign=index&utm_content=original">
  <link rel="stylesheet" href="StyleYouTube.CSS">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="viewport" content="width= , initial-scale=1.0">
  <title>YouTube</title>
</head>
<body>
  

<header class="A-header">


  <div class="A-start">
    <button class="A-menu" title="القائمة">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a href="#" class="A-logo">
      <span class="logo-text">YouTube</span>
      <i class="fa-brands fa-youtube logo-icon"></i>
    </a>
  </div>

 <div class="A-search">
      <input type="text" placeholder="بحث">

<button class="A-keyboard" title="لوحة المفاتيح">
        <i class="fa-regular fa-keyboard"></i>
      </button>
      
</div>

  <div class="B-header">
    

      

      <button class="B-search" title="بحث">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    

    <button class="A-voice" title="البحث بالصوت">
      <i class="fa-solid fa-microphone"></i>
    </button>
  </div> 

  <div class="C-header">
    <button class="A-create">
      <i class="fa-solid fa-plus"></i>
      <span>إنشاء</span>
    </button>

    <button class="A-icon" title="الإشعارات">
      <i class="fa-regular fa-bell"></i>
    </button>

    <button class="A-avatar" title="الحساب">
      <span class="avatar-letter">O</span>
    </button>
  </div>

</header>

  <nav class="A-nav">
    <button class="A-chip">محتوى جديد لك</button>
    <button class="chip">فيديوهات محملة مؤخرًا</button>
    <button class="chip">ألعاب فيديو رياضية</button>
    <button class="chip">كرة القدم</button>
    <button class="chip">ألعاب مغامرات وحركة</button>
    <button class="chip">رسوم متحركة</button>
    <button class="chip">مباشر</button>
    <button class="chip">ميكسات</button>
    <button class="chip">بودكاست</button>
    <button class="chip">موسيقى</button>
  </nav>

</body>
</html>
