<body>

<h1 class="A-address">أهلا بك في موقع حاسبة العمر</h1>


    <div class="container">

        <h2 class="B-address">حاسبة العمر</h2>
        <label for="ageInput">أدخل عمرك بالسنين:</label>
        <input type="number" id="ageInput" placeholder="مثال: 20">

        <label for="unitSelect">اختر وحدة الحساب:</label>
        <select id="unitSelect">
            <option value="months">بالشهور</option>
            <option value="days">بالأيام</option>
            <option value="hours">بالساعات</option>
        </select>

        <button onclick="AgeUser()">احسب</button>

        <h3 id="result"></h3>
    </div>
